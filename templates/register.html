{% extends 'base.html' %}

{% block title %}User Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-25 text-success mb-3" style="width:60px; height:60px; font-size:1.8rem;">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h3 class="text-white fw-bold">Create Account</h3>
                    <p class="text-secondary small">Register operator account for traffic monitoring</p>
                </div>

                <form id="registerForm" method="POST" action="{{ url_for('register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-cyber" placeholder="Choose a username (min 3 chars)" minlength="3" maxlength="64" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control form-control-cyber" placeholder="name@smarttraffic.ai" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-cyber" placeholder="Create strong password (min 6 chars)" minlength="6" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-cyber" placeholder="Repeat password" minlength="6" required>
                    </div>

                    <button type="submit" id="regBtn" class="btn btn-cyber w-100 mb-3 py-2 fw-bold">
                        <i class="fa-solid fa-user-check me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <span class="text-secondary small">Already have an account?</span>
                    <a href="{{ url_for('login') }}" class="text-cyan small fw-bold text-decoration-none ms-1">Log In</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
    var btn = document.getElementById('regBtn');
    if (btn.getAttribute('data-submitting') === 'true') {
        e.preventDefault();
        return false;
    }
    btn.setAttribute('data-submitting', 'true');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Registering...';
    this.submit();
});
</script>
{% endblock %}
