; PlatformIO Project Configuration File for ESP32 IR Vehicle Counter
; Compatible with Wokwi Simulator, VS Code PlatformIO extension, Arduino CLI, and Physical ESP32 Hardware

[platformio]
default_envs = esp32dev
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Automatically installed libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

; Compiler flags
build_flags =
    -DMQTT_MAX_PACKET_SIZE=640

; Source filter targeting sketch and converted C++ sources while excluding build directories
build_src_filter =
    +<*.ino*>
    +<*.cpp>
    +<*.c>
    -<build/>
    -<.pio/>
