; PlatformIO Project Configuration File for ESP32-CAM Wokwi Simulation
; Compatible with Wokwi Simulator, VS Code PlatformIO extension, and ESP32 DevKit

[platformio]
default_envs = esp32dev
src_dir = wokwi
include_dir = wokwi
build_dir = C:/Users/Karthik/.pio_build/esp32_cam

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DMQTT_MAX_PACKET_SIZE=640
